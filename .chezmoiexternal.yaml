{{- $normalizedOs := $.chezmoi.os | replace "darwin" "macos" -}}
{{- $osTitle := $.chezmoi.os | title -}}

{{ if get .packages "external" -}}
{{- range .packages.external }}
{{ .target | quote }}:
  {{- .config | toYaml | trim | nindent 2 | replace "${os}" $normalizedOs | replace "${osTitle}" $osTitle | replace "${arch}" $.chezmoi.arch }}
{{- end }}

{{ end -}}

{{ if .ssh.keysUrl -}}
.ssh/authorized_keys:
  type: file
  url: {{ .ssh.keysUrl | quote }}
  private: true
  refreshPeriod: 24h

{{ end -}}

{{ if .configure.vim -}}
.vim/autoload/plug.vim:
  type: file
  url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
  refreshPeriod: 168h

{{ end -}}

{{ if .configure.tmux -}}
.tmux/plugins/tpm:
  type: archive
  url: https://github.com/tmux-plugins/tpm/archive/master.tar.gz
  stripComponents: 1
  exact: true
  refreshPeriod: 168h

{{ end -}}

{{ if .configure.k9s -}}
.config/k9s/skins/one-light.yaml:
  type: file
  url: https://raw.githubusercontent.com/derailed/k9s/master/skins/one-light.yaml
  refreshPeriod: 168h

{{ end -}}

{{ if .configure.yazi -}}
.config/yazi/OneHalfLight.tmTheme:
  type: file
  url: https://raw.githubusercontent.com/sonph/onehalf/master/sublimetext/OneHalfLight.tmTheme
  refreshPeriod: 168h

{{ end -}}
